name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  # ── Build & Test ──────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm install --ignore-scripts

      - name: Build frontend
        run: npm run docs:build

      - name: Build frontend (Dashboard)
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Build Go binary
        run: go build -o /tmp/AgnesCodeProxy ./cmd/AgnesCodeProxy/

      - name: Run tests
        run: go test ./pkg/auth/... ./pkg/logrot/... ./pkg/store/... -v 2>&1 | tail -20

      - name: Smoke test
        run: |
          /tmp/AgnesCodeProxy version
          /tmp/AgnesCodeProxy serve --tls=false --skip-validation &
          SERVER_PID=$!
          for i in $(seq 1 15); do
            if curl -sf http://localhost:34891/health > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:34891/health
          kill $SERVER_PID

  # ── Release (only on version tags) ────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Build linux-amd64
        run: |
          go build -trimpath -ldflags "-s -w" \
            -o /tmp/AgnesCodeProxy-linux-amd64 \
            ./cmd/AgnesCodeProxy/
          /tmp/AgnesCodeProxy-linux-amd64 version

      - name: Generate checksums
        run: |
          cd /tmp
          sha256sum AgnesCodeProxy-* > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AgnesCode2Api ${{ github.ref_name }}
          body: |
            ## AgnesCode2Api ${{ github.ref_name }}

            ### Downloads
            - `AgnesCodeProxy-linux-amd64` — Linux (x86_64)

            ### Quick Start
            ```bash
            chmod +x AgnesCodeProxy-linux-amd64
            ./AgnesCodeProxy-linux-amd64 serve
            ```

            Then connect Claude Code:
            ```bash
            export ANTHROPIC_BASE_URL=http://localhost:34891
            export ANTHROPIC_API_KEY=agnescode
            claude
            ```

            ### Verify checksum
            ```bash
            sha256sum -c checksums-sha256.txt
            ```
          files: |
            /tmp/AgnesCodeProxy-linux-amd64
            /tmp/checksums-sha256.txt